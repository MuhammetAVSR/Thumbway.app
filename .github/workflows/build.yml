name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodlari Al
      uses: actions/checkout@v4

    - name: ZIP Dosyasini Ac
      run: |
        python3 -c "
        import zipfile, glob
        zips = glob.glob('*.zip')
        if not zips:
            print('ZIP bulunamadi!')
            exit(1)
        with zipfile.ZipFile(zips[0], 'r') as z:
            z.extractall('proje')
        "

    - name: Java Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: APK Derle
      run: |
        GRADLEW=$(find proje -name "gradlew" -type f | head -n 1)
        DIR=$(dirname "$GRADLEW")
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Thumbway-APK
        path: '**/app-debug.apk'
