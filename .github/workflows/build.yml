name: Dosyalari Gor

on:
  push:
    branches: [ main, master ]

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: ZIP Icerigini Listele
      run: |
        python3 -c "import zipfile, glob; z=zipfile.ZipFile(glob.glob('*.zip')[0]); print('\n'.join(z.namelist()[:40]))"
