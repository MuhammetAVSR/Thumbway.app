name: Build Thumbway Debug APK
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  build-debug-apk:
    name: Assemble Debug APK (app)
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
 
      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
 
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
 
      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
 
      - name: Verify generated APK output
        run: |
          echo "Generated APK artifacts:"
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +
 
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbway-debug-apk
          path: |
            app/build/outputs/apk/**/debug/*.apk
            !app/build/outputs/apk/**/debug/*-unaligned.apk
          retention-days: 14
          if-no-files-found: error
